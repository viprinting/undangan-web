<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    
    <!-- Google Fonts untuk kesan Mewah (Serif & Sans-Serif) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    
    <!-- Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/id.js"></script> <!-- Translate ke Bahasa Indonesia -->
    <!-- Library Flatpickr untuk Custom Format Tanggal -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css"> <!-- Sesuai tema gelap undangan -->

    <style>
        /* CSS RESET & VARIABLES */
        :root {
            --bg-color: #0A1128; /* Midnight Blue */
            --gold-light: #F9E596;
            --gold-main: #D4AF37;
            --gold-dark: #AA8C2C;
            --text-light: #F8F9FA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Lato', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* Menggunakan Dynamic Viewport Height untuk HP */
            overflow: hidden;
        }

        /* CONTAINER UTAMA (Mobile First) */
        .invitation-card {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Jarak atas dikecilkan, jarak bawah dibesarkan agar konten naik */
            padding: 20px 20px 160px 20px; 
            text-align: center;
            position: relative;
            background: radial-gradient(circle at center, #111D4A 0%, #0A1128 100%);
            opacity: 0;
            animation: fadeIn 2s ease-in-out forwards;
        }

        /* ORNAMEN DEKORASI (Bisa diganti gambar jika ada) */
        .ornament {
            font-size: 24px;
            color: var(--gold-main);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold-light);
            margin-bottom: 15px;
        }

        .names {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            color: var(--gold-main);
            line-height: 1.2;
            margin-bottom: 30px;
            text-shadow: 0px 2px 10px rgba(212, 175, 55, 0.2);
        }

        .details {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #E0E0E0;
        }

        .details span {
            display: block;
            font-weight: 300;
        }

        .details .date {
            font-weight: 400;
            font-size: 18px;
            color: var(--gold-light);
            margin-bottom: 5px;
        }

        /* TOMBOL-TOMBOL */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
        }

        .btn {
            display: inline-block;
            padding: 14px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: 'Lato', sans-serif;
            text-transform: uppercase;
        }

        .btn-maps {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-main));
            color: var(--bg-color);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-maps:hover {
            background: linear-gradient(135deg, var(--gold-main), var(--gold-dark));
            transform: translateY(-2px);
        }

        .btn-reminder {
            background: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-main);
        }

        .btn-reminder:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        /* LOADING STATE */
        .loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: var(--gold-main);
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            transition: opacity 0.5s ease;
        }

        /* MODAL (POP-UP) PENGINGAT */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #111D4A;
            padding: 30px 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 1px solid var(--gold-dark);
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h3 {
            color: var(--gold-main);
            margin-bottom: 10px;
            font-family: 'Playfair Display', serif;
        }

        .modal-content p {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-content input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0A1128;
            color: white;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
        }

        .modal-content input:focus {
            border-color: var(--gold-main);
        }

        .btn-submit {
            background: var(--gold-main);
            color: var(--bg-color);
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-cancel {
            background: transparent;
            color: #aaa;
            width: 100%;
            font-size: 12px;
        }

        /* ANIMASI */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ====================================
           FOOTER PERCETAKAN
           ==================================== */
        .footer-credit {
            position: absolute;
            bottom: 35px;
            width: 100%;
            padding: 0 40px; 
            text-align: center;
            z-index: 10;
        }

        .footer-link-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ccc;
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        .footer-link-container:hover {
            opacity: 1;
            color: var(--gold-light);
            transform: translateY(-3px);
        }

        /* Wadah logo dan garis */
        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 15px;
        }

        /* Membuat garis elegan di sebelah kiri dan kanan logo / garis menyatu */
        .logo-wrapper::before,
        .logo-wrapper::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold-main));
            opacity: 0.6;
        }

        .logo-wrapper::after {
            background: linear-gradient(to left, transparent, var(--gold-main));
        }

        .footer-logo {
            height: 35px;
            width: auto;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5)); 
            transition: transform 0.3s ease;
        }

        .footer-link-container:hover .footer-logo {
            transform: scale(1.05); 
        }

        /* Pengaturan teks di bawah logo */
        .footer-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11.5px;
            font-family: 'Lato', sans-serif;
            letter-spacing: 0.5px;
        }

        .separator {
            color: var(--gold-main);
            font-size: 10px;
        }

        .wa-icon {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- Layar Loading Awal -->
    <div class="loading-screen" id="loadingScreen">
        Membuka Undangan...
    </div>

    <!-- Konten Undangan Utama -->
    <div class="invitation-card" id="invitationCard" style="display: none;">
        <div class="ornament">✧</div>
        <div class="subtitle">The Wedding Of</div>
        
        <!-- Data Dinamis akan dimuat ke sini -->
        <h1 class="names" id="nama-mempelai">... & ...</h1>
        
        <div class="details">
            <span class="date" id="tanggal-resepsi">...</span>
            <span id="waktu-resepsi">...</span>
        </div>

        <div class="btn-container">
            <!-- Tombol Buka Maps (Link Dinamis) -->
            <a href="#" class="btn btn-maps" id="btn-maps" target="_blank">Buka Google Maps</a>
            
            <!-- Tombol Pengingat -->
            <button class="btn btn-reminder" onclick="openModal()">Ingatkan Saya</button>
        </div>

        <!-- Footer Logo & WA Percetakan -->
        <div class="footer-credit">
            <a href="#" id="footer-link" target="_blank" class="footer-link-container">
                
                <!-- Logo dengan Garis Kiri Kanan -->
                <div class="logo-wrapper" id="logoWrapper">
                    <img src="LOGO MUFLIH.webp" alt="Logo Percetakan" class="footer-logo" id="footerLogo">
                </div>

                <!-- Teks Nama Percetakan dan Nomor WA -->
                <div class="footer-text">
                    <span id="footerNamaPercetakan">Percetakan Muflih Print</span>
                    <span class="separator">|</span>
                    <svg class="wa-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
                    </svg>
                    <span id="footerNoWa">081574009621</span>
                </div>
                
            </a>
        </div>
    </div>

    <!-- Modal Form Pengingat WA -->
    <div class="modal-overlay" id="reminderModal">
        <div class="modal-content">
            <h3>Pengingat Otomatis</h3>
            <p>Masukkan nomor WhatsApp dan atur waktu kapan Anda ingin diingatkan tentang acara ini.</p>
            
            <form id="formReminder">
                <input type="tel" id="waNumber" placeholder="Contoh: 081234567890" required pattern="[0-9]+" minlength="10">
                
                <!-- Input waktu diubah menjadi type="text" -->
                <input type="text" id="waktuPengingat" required placeholder="Pilih tanggal dan waktu pengingat" style="margin-bottom: 5px;">
                
                <!-- Teks pemberitahuan otomatis -->
                <p id="teksPemberitahuan" style="font-size: 12px; color: var(--gold-main); margin-bottom: 20px; text-align: left;"></p>
                <button type="submit" class="btn btn-submit" id="btnSubmitForm">Simpan Nomor</button>
                <button type="button" class="btn btn-cancel" onclick="closeModal()">Batal</button>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. KONFIGURASI SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://qnnacckoyfzrmvobwccb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFubmFjY2tveWZ6cm12b2J3Y2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwOTIxNTEsImV4cCI6MjEwNzY2ODE1MX0.XbLOSpq1ylDjkxrDqoQBJIFAZp6RhsDiCiXn6kF9NjA';

        // Inisialisasi Supabase
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let dataWeddingId = "";
        let jadwalFonnte = "";
        
        // --- Variabel Baru ---
        let jamResepsiAcara = "08:00"; 
        let tanggalResepsiAcara = "";
        

        // ==========================================
        // 2. MENGAMBIL DATA DARI DATABASE BERDASARKAN URL
        // ==========================================
        async function muatDataUndangan() {
            // Ambil parameter ?id= dari URL
            const urlParams = new URLSearchParams(window.location.search);
            const undanganId = urlParams.get('id');

            const loadingScreen = document.getElementById('loadingScreen');
            const invitationCard = document.getElementById('invitationCard');

            // Jika URL tidak memiliki parameter ?id=
            if (!undanganId) {
                loadingScreen.innerHTML = "ID Undangan tidak ditemukan.<br><span style='font-size:14px; margin-top:10px;'>Pastikan URL menggunakan ?id=nama-pasangan</span>";
                return;
            }

            try {
                // Query ke tabel data_undangan menggunakan Supabase (melakukan relasi ke tabel percetakan)
                const { data, error } = await supabaseClient
                    .from('data_undangan')
                    .select(`
                        id, 
                        "wPanggilan", 
                        "pPanggilan", 
                        "tanggalResepsi", 
                        "jamResepsi", 
                        maps_link, 
                        "usernamePercetakan",
                        percetakan (
                            username,
                            nama,
                            no_wa
                        )
                    `)
                    .eq('url_undangan', undanganId)
                    .single(); // Ambil 1 data saja

                if (error || !data) {
                    loadingScreen.innerHTML = "Maaf, Undangan tidak ditemukan.";
                    console.error("Supabase Error:", error);
                    return;
                }

                // Jika data ditemukan, masukkan ke dalam HTML
                document.getElementById('nama-mempelai').innerText = `${data.wPanggilan} & ${data.pPanggilan}`;
                document.getElementById('tanggal-resepsi').innerText = data.tanggalResepsi;
                document.getElementById('waktu-resepsi').innerText = data.jamResepsi;
                // Ekstrak waktu jam (misal "11.00" atau "11:00") dari string database
                const jamMatch = data.jamResepsi.match(/(\d{1,2})[.:](\d{2})/);
                if (jamMatch) {
                    // Gabungkan dan format ke bentuk HH:mm (contoh: "11:00") agar bisa dihitung
                    jamResepsiAcara = `${jamMatch[1].padStart(2, '0')}:${jamMatch[2]}`;
                }
                
                if (data.maps_link) {
                    document.getElementById('btn-maps').href = data.maps_link;
                } else {
                    document.getElementById('btn-maps').style.display = 'none'; // Sembunyikan jika maps_link kosong
                }

              // Logika Penyesuaian Footer berdasarkan usernamePercetakan
                const usernamePercetakan = data.usernamePercetakan;
                const footerLogo = document.getElementById('footerLogo');
                const logoWrapper = document.getElementById('logoWrapper'); // Ambil elemen wrapper logo
                const footerNama = document.getElementById('footerNamaPercetakan');
                const footerNoWa = document.getElementById('footerNoWa');
                const footerLink = document.getElementById('footer-link');

                if (usernamePercetakan === 'muflihprint') {
                    // Tampilkan Logo Muflih Print
                    footerLogo.style.display = 'block';
                    logoWrapper.style.gap = '15px'; // Berikan jarak antara garis dan logo
                    
                    footerNama.innerText = "Percetakan Muflih Print";
                    footerNoWa.innerText = "081574009621";
                    footerLink.href = "https://wa.me/6281574009621?text=Halo%20Muflih%20Print,%20saya%20ingin%20menanyakan%20info%20pembuatan%20undangan";
                } else {
                    // Jika bukan muflihprint, hilangkan logo dan sesuaikan dengan data tabel percetakan
                    footerLogo.style.display = 'none'; // Logo dihilangkan
                    logoWrapper.style.gap = '0px'; // Hilangkan jarak (gap) agar garis menyatu sepenuhnya
                    
                    if (data.percetakan) {
                        const namaP = data.percetakan.nama || "Percetakan";
                        const waP = data.percetakan.no_wa || "";
                        
                        // Modifikasi agar nomor WA yang ditampilkan dimulai dari 0
                        let waTampil = waP;
                        if (waTampil.startsWith('62')) {
                            waTampil = '0' + waTampil.substring(2);
                        } else if (waTampil.startsWith('+62')) {
                            waTampil = '0' + waTampil.substring(3);
                        }
                        
                        footerNama.innerText = namaP;
                        footerNoWa.innerText = waTampil; // Menampilkan nomor dengan awalan 0
                        
                        // Link WhatsApp tetap menggunakan format database (waP) agar tidak error saat diklik
                        footerLink.href = `https://wa.me/${waP}?text=Halo%20${encodeURIComponent(namaP)},%20saya%20ingin%20menanyakan%20info%20pembuatan%20undangan`;
                    } else {
                        footerNama.innerText = "Percetakan";
                        footerNoWa.innerText = "";
                        footerLink.href = "#";
                    }
                }

           // Simpan id (UUID) dan tanggal resepsi
                dataWeddingId = data.id;
                // Kita gunakan variabel global yang sama untuk menampung string tanggal resepsi
                jadwalFonnte = data.tanggalResepsi;
                // -------------------------------------------------------

                // Matikan loading, tampilkan undangan
                loadingScreen.style.opacity = "0";
                setTimeout(() => {
                    loadingScreen.style.display = "none";
                    invitationCard.style.display = "flex";
                }, 500);

            } catch (err) {
                loadingScreen.innerHTML = "Terjadi kesalahan sistem.";
                console.error(err);
            }
        }

        // Jalankan fungsi saat halaman web pertama kali dibuka
        window.onload = muatDataUndangan;

        // Fungsi untuk mengonversi nama bulan Indonesia ke angka
        function getBulanAngka(namaBulan) {
            const bulan = {
                "januari": "01", "februari": "02", "maret": "03", "april": "04",
                "mei": "05", "juni": "06", "juli": "07", "agustus": "08",
                "september": "09", "oktober": "10", "november": "11", "desember": "12"
            };
            return bulan[namaBulan.toLowerCase()] || "01"; // Default ke 01 jika tidak dikenali
        }


        // Inisialisasi Flatpickr dengan Format Kustom
        let fpInstance = flatpickr("#waktuPengingat", {
            enableTime: true,
            time_24hr: true,
            locale: "id", // Menggunakan Bahasa Indonesia
            altInput: true, // Membuat input palsu untuk dilihat user
            
            // Catatan: Umumnya format Indonesia adalah DD/MM/YYYY (d/m/Y). 
            // Jika Anda benar-benar butuh format Hari/Tahun/NamaBulan (DD/YY/MMMM), ganti menjadi: "d/y/F H:i"
            altFormat: "d/m/Y H:i", 
            
            dateFormat: "Y-m-d\\TH:i", // Jangan diubah: Format sistem di balik layar (YYYY-MM-DDTHH:mm)
            onChange: function() {
                updatePemberitahuan(); // Langsung perbarui teks hitung mundur saat tanggal diganti
            }
        });

        // ==========================================
        // 3. LOGIKA POP-UP MODAL & PENYIMPANAN NOMOR
        // ==========================================
        const modal = document.getElementById('reminderModal');

       function openModal() {
            modal.classList.add('active');
            
            // 1. Tanggal fallback (hari ini)
            let fallbackDate = new Date();
            let yyyy = fallbackDate.getFullYear();
            let mm = String(fallbackDate.getMonth() + 1).padStart(2, '0');
            let dd = String(fallbackDate.getDate()).padStart(2, '0');
            let tanggalValid = `${yyyy}-${mm}-${dd}`;

            // 2. Coba ekstrak tanggal dari kolom tanggalResepsi (contoh: "Minggu, 08 November 2026")
            if (jadwalFonnte) {
                try {
                    // Cari pola angka (1 atau 2 digit), spasi, huruf (nama bulan), spasi, angka (4 digit tahun)
                    // Pola Regex ini akan mengabaikan hari ("Minggu,")
                    let polaTanggalIndo = jadwalFonnte.match(/(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})/);

                    if (polaTanggalIndo) {
                        let tanggalExtracted = polaTanggalIndo[1].padStart(2, '0'); // Pad ke 2 digit (misal '7' jadi '07')
                        let bulanExtracted = getBulanAngka(polaTanggalIndo[2]);     // Terjemahkan nama bulan
                        let tahunExtracted = polaTanggalIndo[3];                    // Ambil tahun

                        tanggalValid = `${tahunExtracted}-${bulanExtracted}-${tanggalExtracted}`;
                    }
                } catch (e) {
                    console.error("Gagal parse tanggalResepsi:", e);
                }
            }

           // 3. Masukkan ke input melalui Flatpickr
            fpInstance.setDate(`${tanggalValid}T08:00`);
            
            // Simpan tanggal valid dan panggil kalkulasi teks otomatis
            tanggalResepsiAcara = tanggalValid;
            updatePemberitahuan();
        }
        
        function closeModal() {
            modal.classList.remove('active');
            document.getElementById('formReminder').reset();
        }

        // Event listener jika user merubah input waktu
        document.getElementById('waktuPengingat').addEventListener('input', updatePemberitahuan);

        function updatePemberitahuan() {
            const teksPemberitahuan = document.getElementById('teksPemberitahuan');
            const waktuPengingat = document.getElementById('waktuPengingat').value;

            if (!waktuPengingat || !tanggalResepsiAcara) return;

            // Gabungkan tanggal acara dan jam acara menjadi satu format Date utuh
            const waktuAcaraFull = new Date(`${tanggalResepsiAcara}T${jamResepsiAcara}`);
            const waktuPengingatFull = new Date(waktuPengingat);

            // Hitung selisih dalam milidetik
            const selisihMs = waktuAcaraFull - waktuPengingatFull;

            // Jika user memilih waktu di masa lalu atau setelah acara
            if (selisihMs <= 0) {
                teksPemberitahuan.innerText = "* Peringatan: Waktu pengingat harus sebelum acara dimulai.";
                teksPemberitahuan.style.color = "#ff4d4d"; // Warna merah
            } else {
                teksPemberitahuan.style.color = "var(--gold-main)";
                
                // Konversi selisih ke jam dan hari
                const selisihJam = Math.floor(selisihMs / (1000 * 60 * 60));
                const selisihHari = Math.floor(selisihJam / 24);

                if (selisihHari > 0) {
                    teksPemberitahuan.innerText = `* Pengingat akan dikirim ${selisihHari} hari sebelum acara.`;
                } else if (selisihJam > 0) {
                    teksPemberitahuan.innerText = `* Pengingat akan dikirim ${selisihJam} jam sebelum acara.`;
                } else {
                    const selisihMenit = Math.floor(selisihMs / (1000 * 60));
                    teksPemberitahuan.innerText = `* Pengingat akan dikirim ${selisihMenit} menit sebelum acara.`;
                }
            }
        }

     // Fungsi ketika tombol "Simpan Nomor" diklik
        document.getElementById('formReminder').addEventListener('submit', async function(e) {
            e.preventDefault(); // Mencegah halaman ter-refresh

            let inputNumber = document.getElementById('waNumber').value;
            let inputWaktu = document.getElementById('waktuPengingat').value; // Mengambil data waktu dari input
            let btnSubmit = document.getElementById('btnSubmitForm');
            
            // Format nomor: Ubah '08...' menjadi '628...'
            if(inputNumber.startsWith('0')) {
                inputNumber = '62' + inputNumber.substring(1);
            }

            // Format tanggal dari "YYYY-MM-DDTHH:mm" menjadi "YYYY-MM-DD HH:mm:00" agar kompatibel dengan sistem pengirim WA (seperti Fonnte)
            let jadwalKirimDipilih = inputWaktu.replace('T', ' ') + ':00';

            // Ubah teks tombol menjadi loading
            btnSubmit.innerText = "Menyimpan...";
            btnSubmit.disabled = true;

            try {
                // 1. Cek apakah nomor WA untuk undangan ini sudah ada di database
                const { data: existingData, error: checkError } = await supabaseClient
                    .from('pengingat_wa')
                    .select('id')
                    .eq('nomor_wa', inputNumber)
                    .eq('wedding_id', dataWeddingId)
                    .maybeSingle(); // maybeSingle mengembalikan data jika ada, atau null jika tidak ada (tanpa error)

                if (checkError) throw checkError;

                let dbError;

                if (existingData) {
                    // 2a. Jika data SUDAH ADA, lakukan UPDATE pada jadwal kirimnya
                    const { error: updateError } = await supabaseClient
                        .from('pengingat_wa')
                        .update({ jadwal_kirim: jadwalKirimDipilih })
                        .eq('id', existingData.id);
                        
                    dbError = updateError;
                } else {
                    // 2b. Jika data BELUM ADA, lakukan INSERT data baru
                    const { error: insertError } = await supabaseClient
                        .from('pengingat_wa')
                        .insert([
                            { 
                                nomor_wa: inputNumber, 
                                wedding_id: dataWeddingId, 
                                jadwal_kirim: jadwalKirimDipilih 
                            }
                        ]);
                        
                    dbError = insertError;
                }

                if (dbError) throw dbError;

                alert("Nomor dan jadwal pengingat berhasil disimpan!");
                closeModal();

            } catch (error) {
                console.error("Error inserting data:", error);
                alert("Gagal menyimpan data. Silakan coba lagi.");
            } finally {
                // Kembalikan kondisi tombol
                btnSubmit.innerText = "Simpan Nomor";
                btnSubmit.disabled = false;
            }
        });
    </script>
